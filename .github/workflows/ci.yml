name: CI

on:
  pull_request:
  push:
    branches: [main, new]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: HTML validation and test suite
        run: npm test

  lighthouse:
    name: Lighthouse (performance, accessibility, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
