name: Publish docs to wiki

# docs/ is the source of truth for documentation; this copies it to the
# repository's GitHub wiki whenever it changes on main.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Sync docs/ to the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push docs to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki doesn't exist yet. Open the repository's Wiki tab, click 'Create the first page', save it, then re-run this workflow."
            exit 1
          fi
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in docs/*.md; do
            # Wiki pages link to each other without the .md extension.
            sed -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' "$file" > "wiki/$(basename "$file")"
          done
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync docs from ${GITHUB_SHA::7}"
          git push
